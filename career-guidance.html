  <style>
    .stage-card {
      display: block; width: 100%; text-align: left; border: 1px solid var(--color-slate-200);
      border-radius: var(--radius-xl); padding: 1.5rem; background: var(--color-white);
      cursor: pointer; transition: all var(--transition-normal);
    }
    .stage-card:hover:not(.active) {
      transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(67, 56, 202, 0.25);
    }
    .stage-card.active {
      border-color: transparent; background: linear-gradient(135deg, #4338CA 0%, #06B6D4 100%);
      box-shadow: var(--shadow-xl); transform: translateY(-3px);
    }
    .stage-card .stage-icon { color: var(--color-indigo); margin-bottom: 0.75rem; transition: color var(--transition-fast); }
    .stage-card.active .stage-icon, .stage-card.active h3, .stage-card.active p { color: var(--color-white) !important; }
    .stage-card p { color: var(--color-slate-500); font-size: 0.85rem; }
    
    .tab-panel { display: none; opacity: 0; animation: fadeIn 0.35s ease forwards; }
    .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .path-card {
      border: 1px solid var(--color-slate-200); border-radius: var(--radius-xl);
      padding: 2.25rem 2rem; background: var(--color-white); transition: all var(--transition-normal);
      display: flex; flex-direction: column; height: 100%;
    }
    .path-card:hover {
      transform: translateY(-4px); box-shadow: var(--shadow-xl); border-color: rgba(67, 56, 202, 0.3);
    }
    .path-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--color-indigo); background: rgba(67, 56, 202, 0.08);
      padding: 0.3rem 0.75rem; border-radius: var(--radius-full); margin-bottom: 1rem; width: max-content;
    }
    .path-btn {
      margin-top: auto; padding-top: 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.9rem; font-weight: 700; color: var(--color-indigo); border: none; background: transparent; cursor: pointer;
    }
    .path-btn:hover { color: var(--color-cyan); }
  </style>
